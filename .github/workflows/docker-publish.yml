name: Build and publish Docker images
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/easy-update-server:${{ github.sha }} -f apps/server/Dockerfile .
      - name: Push server image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/easy-update-server:${{ github.sha }}
      - name: Build client image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/easy-update-client:${{ github.sha }} -f apps/client/Dockerfile .
      - name: Push client image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/easy-update-client:${{ github.sha }}
